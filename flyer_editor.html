<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyer Editor – Fasnet 2027 Salmendingen</title>
  <link rel="icon" type="image/png" href="./assets/img/kappe.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-primary: #0b50bd;
      --color-primary-dark: #073887;
      --color-accent: #f2b42c;
      --color-red: #d9242a;
      --color-bg: #0f172a;
      --color-surface: #1e293b;
      --color-border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--color-bg);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top App Header */
    .editor-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .editor-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #ffffff;
    }

    .editor-brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .editor-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .editor-title span {
      color: var(--color-accent);
      font-size: 0.9rem;
      display: block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
    }

    /* Format Switcher Tabs */
    .format-tabs {
      display: flex;
      background: #0f172a;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      gap: 4px;
    }

    .format-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .format-btn:hover {
      color: #ffffff;
    }

    .format-btn.active {
      background: var(--color-primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(11, 80, 189, 0.4);
    }

    /* Action Buttons */
    .editor-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn-export-png {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-export-png:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .btn-export-svg {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0.6rem 1.1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-export-svg:hover {
      background: #475569;
      color: #ffffff;
    }

    .btn-reset {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.3rem 0.6rem;
    }

    .btn-reset:hover {
      color: #f87171;
    }

    /* Main Workspace */
    .editor-workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      overflow: auto;
    }

    .flyer-stage {
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(11, 80, 189, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: #0b50bd;
      transition: all 0.3s ease;
    }

    /* Feed dimensions preview */
    .flyer-stage.format-feed {
      width: 580px;
      height: 580px;
    }

    /* Story dimensions preview */
    .flyer-stage.format-story {
      width: 440px;
      height: 782px; /* 9:16 aspect */
    }

    @media (max-width: 650px) {
      .flyer-stage.format-feed {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
      }
      .flyer-stage.format-story {
        width: 100%;
        height: auto;
        aspect-ratio: 9 / 16;
      }
    }

    .flyer-stage svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Editable Text Hover Feedback */
    .flyer-stage text {
      outline: none;
      transition: opacity 0.15s;
    }

    .flyer-stage text:hover {
      cursor: text;
      fill-opacity: 0.9;
    }

    .flyer-stage text:focus {
      outline: 2px dashed #f2b42c;
    }

    /* Helper Banner */
    .editor-hint-banner {
      background: rgba(15, 23, 42, 0.85);
      border-top: 1px solid var(--color-border);
      padding: 0.75rem 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .editor-hint-banner strong {
      color: var(--color-accent);
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Controls -->
  <header class="editor-header">
    <a href="./petzen.html" class="editor-brand">
      <img src="./assets/img/kappe.png" alt="Narrenkappe">
      <div class="editor-title">
        Flyer Editor 🎨

    <!-- Format Tabs -->
    <div class="format-tabs">
      <button class="format-btn active" id="tab-feed" onclick="switchFormat('feed')">
        📷 Feed (1:1)
      </button>
      <button class="format-btn" id="tab-story" onclick="switchFormat('story')">
        📱 Story (9:16)
      </button>
    </div>

    <!-- Actions -->
    <div class="editor-actions">
      <button type="button" class="btn-export-png" id="btn-export-png" onclick="exportFlyer('png')">
        📥 Als PNG herunterladen
      </button>
      <button type="button" class="btn-export-svg" onclick="exportFlyer('svg')">
        📄 SVG speichern
      </button>
      <button type="button" class="btn-reset" onclick="resetFlyerText()">
        Zurücksetzen
      </button>
    </div>
  </header>

  <!-- Workspace Canvas -->
  <main class="editor-workspace">
    <div class="flyer-stage format-feed" id="flyer-stage">
      <!-- Embedded Interactive SVG Container -->

    var storySvgTemplate = `

    function renderSvg() {
      var container = document.getElementById('svg-container');
      container.innerHTML = (currentFormat === 'feed') ? feedSvgTemplate : storySvgTemplate;

      // Enable inline click-to-edit on all text elements
      var texts = container.querySelectorAll('text');
      texts.forEach(function (t) {
        t.setAttribute('tabindex', '0');
        t.addEventListener('click', function (e) {
          e.stopPropagation();
          var currentVal = t.textContent;
          var newVal = prompt('Text bearbeiten:', currentVal);
          if (newVal !== null && newVal.trim() !== '') {
            t.textContent = newVal;
          }
        });
      });
    }

    function switchFormat(format) {
      currentFormat = format;
      var stage = document.getElementById('flyer-stage');
      var tabFeed = document.getElementById('tab-feed');
      var tabStory = document.getElementById('tab-story');

      if (format === 'feed') {
        stage.className = 'flyer-stage format-feed';
        tabFeed.classList.add('active');
        tabStory.classList.remove('active');
      } else {
        stage.className = 'flyer-stage format-story';
        tabStory.classList.add('active');
        tabFeed.classList.remove('active');
      }

      renderSvg();
    }

    function resetFlyerText() {
      renderSvg();
    }

    function exportFlyer(type) {
      var svgElement = document.getElementById('current-svg');
      if (!svgElement) return;

      var serializer = new XMLSerializer();
      var svgString = serializer.serializeToString(svgElement);

      if (type === 'svg') {
        var blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'petzen_flyer_' + currentFormat + '.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        return;
      }

      if (type === 'png') {
        var exportBtn = document.getElementById('btn-export-png');
        if (exportBtn) exportBtn.textContent = '⏳ Wird generiert...';

        var width = (currentFormat === 'feed') ? 1080 : 1080;
        var height = (currentFormat === 'feed') ? 1080 : 1920;

        var canvas = document.getElementById('offscreen-canvas');
        canvas.width = width;
        canvas.height = height;
        var ctx = canvas.getContext('2d');

        var img = new Image();
        var svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        var url = URL.createObjectURL(svgBlob);

        img.onload = function () {
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);

          var pngUrl = canvas.toDataURL('image/png');
          var a = document.createElement('a');
          a.href = pngUrl;
          a.download = 'petzen_flyer_' + currentFormat + '.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          if (exportBtn) exportBtn.textContent = '📥 Als PNG herunterladen';
        };

        img.onerror = function (e) {
          console.error('PNG Export error:', e);
          alert('Export als PNG fehlgeschlagen. Du kannst den Flyer auch als SVG herunterladen!');
          if (exportBtn) exportBtn.textContent = '📥 Als PNG herunterladen';
        };

        img.src = url;
      }
    }

    // Initial render
    renderSvg();
  </script>
</body>
</html>

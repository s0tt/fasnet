<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Import Google Font Fredoka -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&amp;display=swap');
      .font-fredoka { font-family: 'Fredoka', 'Outfit', -apple-system, sans-serif; }
      .cursor-text { cursor: text; }
    </style>

    <!-- Drop Shadows -->
    <filter id="badge-shadow" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#042154" flood-opacity="0.4"/>
    </filter>
    <filter id="pill-shadow" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="text-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#042154" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Royal Blue Background -->
  <rect width="1080" height="1920" fill="#0b50bd"/>

  <!-- Subtle Radial Gradient Highlights -->
  <radialGradient id="bg-glow" cx="50%" cy="25%" r="60%">
    <stop offset="0%" stop-color="#1d68dc" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#0b50bd" stop-opacity="0"/>
  </radialGradient>
  <rect width="1080" height="1920" fill="url(#bg-glow)"/>

  <!-- =========================================================================
       Carnival Streamers & Confetti
       ========================================================================= -->
  <g id="decorations" opacity="0.95">
    <!-- Streamer 1: Orange Left -->
    <path d="M 80 -20 C 140 100, 30 200, 130 300 C 200 390, 80 470, 140 560" 
          fill="none" stroke="#ff8c2b" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Streamer 2: White Left-Center -->
    <path d="M 260 -20 C 190 110, 320 220, 210 330 C 130 420, 280 500, 200 600" 
          fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>

    <!-- Streamer 3: Orange Center-Right -->
    <path d="M 700 -20 C 780 100, 650 210, 750 310 C 830 400, 680 490, 760 580" 
          fill="none" stroke="#ff8c2b" stroke-width="32" stroke-linecap="round"/>

    <!-- Streamer 4: White Right -->
    <path d="M 870 -20 C 790 90, 930 190, 830 290 C 760 380, 900 480, 830 580" 
          fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>

    <!-- Streamer 5: Pink Far Right -->
    <path d="M 990 -10 C 930 100, 1030 200, 960 290 C 890 380, 1010 470, 940 560" 
          fill="none" stroke="#ff4081" stroke-width="26" stroke-linecap="round"/>

    <!-- Confetti Dots -->
    <circle cx="90" cy="140" r="18" fill="#ff4081"/>
    <circle cx="170" cy="90" r="15" fill="#00d2ff"/>
    <circle cx="210" cy="220" r="22" fill="#f2b42c"/>
    <circle cx="310" cy="120" r="20" fill="#ff8c2b"/>
    <circle cx="370" cy="240" r="16" fill="#ffffff"/>
    <circle cx="430" cy="90" r="18" fill="#00d2ff"/>
    <circle cx="650" cy="130" r="20" fill="#00d2ff"/>
    <circle cx="720" cy="210" r="17" fill="#ff4081"/>
    <circle cx="790" cy="100" r="24" fill="#f2b42c"/>
    <circle cx="920" cy="110" r="18" fill="#ffffff"/>
    <circle cx="950" cy="220" r="22" fill="#ff8c2b"/>
    <circle cx="1030" cy="140" r="16" fill="#00d2ff"/>
    <circle cx="60" cy="380" r="20" fill="#f2b42c"/>
    <circle cx="1020" cy="420" r="18" fill="#ff4081"/>
    <circle cx="150" cy="480" r="16" fill="#00d2ff"/>
    <circle cx="930" cy="500" r="18" fill="#ffffff"/>
  </g>

  <!-- =========================================================================
       Narrenkappe (Carnival Cap)
       ========================================================================= -->
  <g id="narrenkappe" transform="translate(540, 280)">
    <image href="../img/kappe.png" x="-150" y="-115" width="300" height="230" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- =========================================================================
       Headline (Editable Text)
       ========================================================================= -->
  <g id="headings">
    <text x="540" y="520" 
          text-anchor="middle" 
          class="font-fredoka cursor-text" 
          font-size="76" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="0.5"
          filter="url(#text-shadow)">JESSAS JESSAS HEIDANEI!</text>

    <text x="540" y="600" 
          text-anchor="middle" 
          class="font-fredoka cursor-text" 
          font-size="40" 
          font-weight="700" 
          fill="#d5e4ff" 
          letter-spacing="0.5">S WIRD DOCH NIX BASSIERT SEI... ODER DOCH?</text>
  </g>

  <!-- =========================================================================
       Center Badge: DIE NEUE PETZEBOX (Editable Text)
       ========================================================================= -->
  <g id="center-badge" transform="translate(540, 800) rotate(-1.5)">
    <!-- Yellow Badge Rect -->
    <rect x="-440" y="-95" width="880" height="190" rx="36" fill="#f2b42c" filter="url(#badge-shadow)"/>
    
    <!-- Top line -->
    <text x="0" y="-15" 
          text-anchor="middle" 
          class="font-fredoka cursor-text" 
          font-size="58" 
          font-weight="800" 
          fill="#073887" 
          letter-spacing="0.5">DIE NEUE PETZEBOX 🤫</text>

    <!-- Bottom line -->
    <text x="0" y="55" 
          text-anchor="middle" 
          class="font-fredoka cursor-text" 
          font-size="52" 
          font-weight="800" 
          fill="#042154" 
          letter-spacing="1">100% ANONYM</text>
  </g>

  <!-- =========================================================================
       Feature Highlight: Sprachnachricht (Editable Text)
       ========================================================================= -->
  <g id="feature-highlight">
    <text x="540" y="1030" 
          text-anchor="middle" 
          class="font-fredoka cursor-text" 
          font-size="46" 
          font-weight="700" 
          fill="#ffffff"
          filter="url(#text-shadow)">NEU: AUCH PER SPRACHNACHRICHT 🎙️</text>
    
    <text x="540" y="1100" 
          text-anchor="middle" 
          class="font-fredoka cursor-text" 
          font-size="36" 
          font-weight="600" 
          fill="#d5e4ff">Einfach einsprechen oder abtippen!</text>
  </g>

  <!-- =========================================================================
       URL Call-To-Action Pill: fasnet.fun/petzen (Editable Text)
       ========================================================================= -->
  <g id="url-cta" transform="translate(540, 1260)">
    <!-- White Pill Button -->
    <rect x="-400" y="-60" width="800" height="120" rx="60" fill="#ffffff" filter="url(#pill-shadow)"/>
    
    <!-- Link Text -->
    <text x="0" y="18" 
          text-anchor="middle" 
          class="font-fredoka cursor-text" 
          font-size="58" 
          font-weight="800" 
          fill="#d9242a" 
          letter-spacing="0.5">fasnet.fun/petzen</text>
  </g>

  <!-- =========================================================================
       Bottom Badges: Elferrat Logo (Left) & Narrenehrenwort Seal (Right)
       ========================================================================= -->
  <g id="bottom-bar">
    <!-- Elferrat Logo Left -->
    <g transform="translate(80, 1680)">
      <image href="../img/elferrat_logo_web.png" x="0" y="0" width="180" height="180" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <!-- Narrenehrenwort Sticker Right -->
    <g transform="translate(930, 1750) rotate(4)">
      <circle cx="0" cy="0" r="110" fill="#f2b42c" filter="url(#badge-shadow)"/>
      <text x="0" y="-15" 
            text-anchor="middle" 
            class="font-fredoka cursor-text" 
            font-size="30" 
            font-weight="800" 
            fill="#073887">Narrenehren-</text>
      <text x="0" y="24" 
            text-anchor="middle" 
            class="font-fredoka cursor-text" 
            font-size="30" 
            font-weight="800" 
            fill="#073887">wort! 🎭</text>
      <text x="0" y="60" 
            text-anchor="middle" 
            class="font-fredoka cursor-text" 
            font-size="19" 
            font-weight="700" 
            fill="#b8171d">100% Sicher</text>
    </g>
  </g>
</svg>
